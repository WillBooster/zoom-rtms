name: Verify Node.js Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'WillBooster/zoom-rtms'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci --ignore-scripts
      - run: node scripts/check-deps.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run C++ tests
        run: |
          cmake -B build/tests -DRTMS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tests --target rtms_tests --parallel 4
          ctest --test-dir build/tests --output-on-failure
      - run: npm run release:pack
      - name: Run Node.js tests
        run: npm exec --no -- jest tests/ts/rtms.test.ts tests/ts/rtms.wrapper.test.ts
      - run: npm run release:test
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.platform }}
          path: dist/node/*
          if-no-files-found: error
