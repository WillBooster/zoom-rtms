name: Publish Node.js Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'WillBooster/zoom-rtms' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/main.yml

  publish:
    needs: verify
    if: github.repository == 'WillBooster/zoom-rtms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: dist/node
          merge-multiple: true
      - name: Create fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: WillBooster/zoom-rtms
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          tag="v${version}"
          gh release create "$tag" dist/node/*.tgz dist/node/*.tar.gz \
            --repo WillBooster/zoom-rtms \
            --target "$GITHUB_SHA" \
            --title "Node.js ${version}" \
            --notes "Node.js packages and native binaries built and tested from this release commit." \
            --prerelease
